name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Release tag to compare with the manifest version
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Python ${{ matrix.python }} / HA ${{ matrix.ha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.14.2'
            ha: minimum
            requirements: requirements-test.txt
          - python: '3.14'
            ha: minimum
            requirements: requirements-test.txt
          - python: '3.14'
            ha: latest
            requirements: requirements-compatibility.txt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install matching Home Assistant and test framework
        run: python -m pip install --upgrade -r "${{ matrix.requirements }}"
      - run: python -m pip check
      - name: Validate metadata and report tested versions
        env:
          HA_CHANNEL: ${{ matrix.ha }}
          RELEASE_TAG: ${{ inputs.release-tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: python scripts/check_metadata.py --ha-channel "$HA_CHANNEL" --tag "$RELEASE_TAG"
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
