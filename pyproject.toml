[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.blauberg_s21 --cov-branch --cov-report=term-missing"

[tool.coverage.report]
fail_under = 95

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/blauberg_s21"]
ignore_missing_imports = true
